<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="440" viewBox="0 0 1440 440" role="img" aria-labelledby="title desc">
<title id="title">AI planning with a human approval boundary</title><desc id="desc">Choose scope, generate, validate, review, approve, then apply atomically. Generating a proposal never creates or updates tickets.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="#617480"/></marker><symbol id="icon-browser" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="15" rx="2"/><path d="M8 22h8M12 18v4M2 7h20"/></symbol><symbol id="icon-api" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="7" rx="2"/><rect x="3" y="14" width="18" height="7" rx="2"/><path d="M7 6.5h.01M7 17.5h.01M12 6.5h5M12 17.5h5"/></symbol><symbol id="icon-database" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.66 4.03 3 9 3s9-1.34 9-3V5M3 12c0 1.66 4.03 3 9 3s9-1.34 9-3"/></symbol><symbol id="icon-github" viewBox="0 0 24 24"><circle cx="6" cy="5" r="3"/><circle cx="18" cy="5" r="3"/><circle cx="6" cy="19" r="3"/><path d="M6 8v8M18 8v1a5 5 0 0 1-5 5H6"/></symbol><symbol id="icon-shield" viewBox="0 0 24 24"><path d="M12 2 21 6v6c0 5-6 9-9 10-3-1-9-5-9-10V6Z"/><path d="m8 12 3 3 5-6"/></symbol><symbol id="icon-provider" viewBox="0 0 24 24"><path d="m12 2 2.8 7.2L22 12l-7.2 2.8L12 22l-2.8-7.2L2 12l7.2-2.8Z"/></symbol><symbol id="icon-vault" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="12" rx="2"/><path d="M7 10V7a5 5 0 0 1 10 0v3"/><circle cx="12" cy="16" r="1"/><path d="M12 17v2"/></symbol><symbol id="icon-ai" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="4"/><path d="M12 6V2M10 2h4M7 11h.01M17 11h.01M8 16h8"/></symbol><symbol id="icon-approval" viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="18" rx="2"/><rect x="9" y="2" width="6" height="4" rx="1"/><path d="m8 14 3 3 5-6"/></symbol><symbol id="icon-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></symbol><symbol id="icon-eye" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></symbol></defs>
<style>text{font-family:Arial,sans-serif;fill:#13232d}.name{font-size:23px;font-weight:700}.body{font-size:16px;fill:#465963}.tag{font-size:13px;font-weight:700;letter-spacing:1.5px;fill:#786344}</style>
<rect width="1440" height="440" fill="#f5f2e9"/><text x="42" y="43" class="tag">WORKFLOWHQ / AI TRUST BOUNDARY</text><text x="42" y="93" font-family="Georgia,serif" font-size="38">From a delivery goal to a reviewed change.</text>
<rect x="42" y="135" width="214" height="212" rx="14" fill="#ffffff" stroke="#bcc5c9"/><use href="#icon-target" x="208" y="148" width="28" height="28" fill="none" stroke="#786344" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><text x="60" y="167" class="tag">01</text><text x="60" y="203" class="name">Choose scope</text><text x="60" y="238" class="body">Project + delivery goal</text><text x="60" y="267" class="body">Provider + approved model</text><text x="60" y="296" class="body">Selected metadata only</text><path d="M256 240 H267" stroke="#617480" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="270" y="135" width="214" height="212" rx="14" fill="#ffffff" stroke="#bcc5c9"/><use href="#icon-provider" x="436" y="148" width="28" height="28" fill="none" stroke="#786344" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><text x="288" y="167" class="tag">02</text><text x="288" y="203" class="name">Generate</text><text x="288" y="238" class="body">Governance checks</text><text x="288" y="267" class="body">Backend credential vault</text><text x="288" y="296" class="body">Budget model by default</text><path d="M484 240 H495" stroke="#617480" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="498" y="135" width="214" height="212" rx="14" fill="#ffffff" stroke="#bcc5c9"/><use href="#icon-shield" x="664" y="148" width="28" height="28" fill="none" stroke="#786344" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><text x="516" y="167" class="tag">03</text><text x="516" y="203" class="name">Validate</text><text x="516" y="238" class="body">Strict output schema</text><text x="516" y="267" class="body">Known targets + hierarchy</text><text x="516" y="296" class="body">Evidence + duplicate flags</text><path d="M712 240 H723" stroke="#617480" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="726" y="135" width="214" height="212" rx="14" fill="#ffffff" stroke="#bcc5c9"/><use href="#icon-eye" x="892" y="148" width="28" height="28" fill="none" stroke="#786344" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><text x="744" y="167" class="tag">04</text><text x="744" y="203" class="name">Review</text><text x="744" y="238" class="body">Read proposal and diff</text><text x="744" y="267" class="body">Inspect affected tickets</text><text x="744" y="296" class="body">No ticket mutations yet</text><path d="M940 240 H951" stroke="#617480" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="954" y="135" width="214" height="212" rx="14" fill="#ffffff" stroke="#bcc5c9"/><use href="#icon-approval" x="1120" y="148" width="28" height="28" fill="none" stroke="#786344" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><text x="972" y="167" class="tag">05</text><text x="972" y="203" class="name">Approve</text><text x="972" y="238" class="body">Explicit human decision</text><text x="972" y="267" class="body">One-time approval</text><text x="972" y="296" class="body">Current access + versions</text><path d="M1168 240 H1179" stroke="#617480" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="1182" y="135" width="214" height="212" rx="14" fill="#e8eee5" stroke="#bcc5c9"/><use href="#icon-database" x="1348" y="148" width="28" height="28" fill="none" stroke="#786344" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><text x="1200" y="167" class="tag">06</text><text x="1200" y="203" class="name">Apply</text><text x="1200" y="238" class="body">One database transaction</text><text x="1200" y="267" class="body">Idempotent retry result</text><text x="1200" y="296" class="body">Mutations + audit together</text>
<text x="42" y="395" class="body">Preview is read-only. Approval is required. Permanent ticket deletion is excluded from the AI action contract.</text></svg>
