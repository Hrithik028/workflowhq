<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="880" viewBox="0 0 1440 880" role="img" aria-labelledby="title desc">
<title id="title">WorkflowHQ system architecture</title><desc id="desc">React calls an authorized Express API backed by PostgreSQL. Signed GitHub events enter a verified ingestion boundary. Personal encrypted credentials enable bounded provider requests, validated proposals and human-approved atomic writes.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 8 4 0 8" fill="#617480"/></marker><symbol id="icon-browser" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="15" rx="2"/><path d="M8 22h8M12 18v4M2 7h20"/></symbol><symbol id="icon-api" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="7" rx="2"/><rect x="3" y="14" width="18" height="7" rx="2"/><path d="M7 6.5h.01M7 17.5h.01M12 6.5h5M12 17.5h5"/></symbol><symbol id="icon-database" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.66 4.03 3 9 3s9-1.34 9-3V5M3 12c0 1.66 4.03 3 9 3s9-1.34 9-3"/></symbol><symbol id="icon-github" viewBox="0 0 24 24"><circle cx="6" cy="5" r="3"/><circle cx="18" cy="5" r="3"/><circle cx="6" cy="19" r="3"/><path d="M6 8v8M18 8v1a5 5 0 0 1-5 5H6"/></symbol><symbol id="icon-shield" viewBox="0 0 24 24"><path d="M12 2 21 6v6c0 5-6 9-9 10-3-1-9-5-9-10V6Z"/><path d="m8 12 3 3 5-6"/></symbol><symbol id="icon-provider" viewBox="0 0 24 24"><path d="m12 2 2.8 7.2L22 12l-7.2 2.8L12 22l-2.8-7.2L2 12l7.2-2.8Z"/></symbol><symbol id="icon-vault" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="12" rx="2"/><path d="M7 10V7a5 5 0 0 1 10 0v3"/><circle cx="12" cy="16" r="1"/><path d="M12 17v2"/></symbol><symbol id="icon-ai" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="4"/><path d="M12 6V2M10 2h4M7 11h.01M17 11h.01M8 16h8"/></symbol><symbol id="icon-approval" viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="18" rx="2"/><rect x="9" y="2" width="6" height="4" rx="1"/><path d="m8 14 3 3 5-6"/></symbol><symbol id="icon-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></symbol><symbol id="icon-eye" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></symbol></defs>
<style>text{font-family:Arial,sans-serif;fill:#13232d}.tag{font-size:12px;font-weight:700;letter-spacing:1.7px;fill:#786344}.name{font-size:24px;font-weight:700}.body{font-size:17px;fill:#465963}.edge{fill:none;stroke:#617480;stroke-width:2.5;marker-end:url(#arrow)}.label{font-size:13px;fill:#465963}.title{font-family:Georgia,serif;font-size:44px}</style>
<rect width="1440" height="880" fill="#f5f2e9"/>
<text x="60" y="57" class="tag">WORKFLOWHQ / SYSTEM DESIGN</text>
<text x="60" y="108" class="title">A clear boundary between intent and action.</text>
<g><rect x="60" y="155" width="340" height="145" rx="16" fill="#ffffff" stroke="#bcc5c9"/><use href="#icon-browser" x="350" y="168" width="28" height="28" fill="none" stroke="#786344" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><text x="82" y="184" class="tag">01 / BROWSER</text><text x="82" y="215" class="name">React + TypeScript</text><text x="82" y="244" class="body">Board, hierarchy, calendar, analytics</text><text x="82" y="267" class="body">Project and AI review interfaces</text></g>
<g><rect x="550" y="155" width="340" height="145" rx="16" fill="#e7eff0" stroke="#bcc5c9"/><use href="#icon-api" x="840" y="168" width="28" height="28" fill="none" stroke="#786344" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><text x="572" y="184" class="tag">02 / BACKEND</text><text x="572" y="215" class="name">Authorized Express API</text><text x="572" y="244" class="body">Session + project access + validation</text><text x="572" y="267" class="body">Domain rules and parameterized SQL</text></g>
<g><rect x="1040" y="155" width="340" height="145" rx="16" fill="#ffffff" stroke="#bcc5c9"/><use href="#icon-database" x="1330" y="168" width="28" height="28" fill="none" stroke="#786344" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><text x="1062" y="184" class="tag">03 / PERSISTENCE</text><text x="1062" y="215" class="name">PostgreSQL</text><text x="1062" y="244" class="body">Tickets, criteria, activity and runs</text><text x="1062" y="267" class="body">Hashed tokens; encrypted credentials</text></g>
<path d="M400 225 H550" class="edge"/><text x="424" y="212" class="label">REST / HTTPS</text>
<path d="M890 225 H1040" class="edge"/><text x="915" y="212" class="label">SQL + transactions</text>
<g><rect x="60" y="390" width="340" height="145" rx="16" fill="#ffffff" stroke="#bcc5c9"/><use href="#icon-github" x="350" y="403" width="28" height="28" fill="none" stroke="#786344" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><text x="82" y="419" class="tag">EXTERNAL / REPOSITORY</text><text x="82" y="450" class="name">GitHub App</text><text x="82" y="479" class="body">Selected repositories + history API</text><text x="82" y="502" class="body">Push / PR / check / deployment events</text></g>
<g><rect x="550" y="390" width="340" height="145" rx="16" fill="#e7eff0" stroke="#bcc5c9"/><use href="#icon-shield" x="840" y="403" width="28" height="28" fill="none" stroke="#786344" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><text x="572" y="419" class="tag">BACKEND / GITHUB</text><text x="572" y="450" class="name">Verified ingestion</text><text x="572" y="479" class="body">Signature, scope and deduplication</text><text x="572" y="502" class="body">Exact ticket key + owner workflow rules</text></g>
<g><rect x="1040" y="390" width="340" height="145" rx="16" fill="#ffffff" stroke="#bcc5c9"/><use href="#icon-provider" x="1330" y="403" width="28" height="28" fill="none" stroke="#786344" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><text x="1062" y="419" class="tag">EXTERNAL / OPTIONAL</text><text x="1062" y="450" class="name">Selected LLM provider</text><text x="1062" y="479" class="body">OpenAI / Anthropic / Google Gemini</text><text x="1062" y="502" class="body">Fixed endpoints; output is untrusted</text></g>
<path d="M400 461 H550" class="edge"/><text x="413" y="447" class="label">Signed webhooks</text>
<path d="M720 390 V300" class="edge"/><text x="741" y="350" class="label">Normalized signals</text>
<g><rect x="60" y="625" width="340" height="145" rx="16" fill="#ffffff" stroke="#bcc5c9"/><use href="#icon-vault" x="350" y="638" width="28" height="28" fill="none" stroke="#786344" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><text x="82" y="654" class="tag">BACKEND / PROTECTED</text><text x="82" y="685" class="name">Personal credential vault</text><text x="82" y="714" class="body">AES-256-GCM; user-owned keys</text><text x="82" y="737" class="body">Plaintext only in backend requests</text></g>
<g><rect x="550" y="625" width="340" height="145" rx="16" fill="#e7eff0" stroke="#bcc5c9"/><use href="#icon-ai" x="840" y="638" width="28" height="28" fill="none" stroke="#786344" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><text x="572" y="654" class="tag">BACKEND / AI</text><text x="572" y="685" class="name">Governed AI preview</text><text x="572" y="714" class="body">Approved model + bounded metadata</text><text x="572" y="737" class="body">Validated proposals; no ticket writes</text></g>
<g><rect x="1040" y="625" width="340" height="145" rx="16" fill="#e8eee5" stroke="#bcc5c9"/><use href="#icon-approval" x="1330" y="638" width="28" height="28" fill="none" stroke="#786344" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><text x="1062" y="654" class="tag">BACKEND / WRITE GATE</text><text x="1062" y="685" class="name">Human-approved apply</text><text x="1062" y="714" class="body">One-time approval + version recheck</text><text x="1062" y="737" class="body">Atomic mutations, audit, idempotency</text></g>
<path d="M400 697 H550" class="edge"/><text x="421" y="683" class="label">Credential boundary</text>
<path d="M890 697 H1040" class="edge"/><text x="911" y="683" class="label">Explicit approval</text>
<path d="M890 187 H929 V598 H720 V625" class="edge"/><text x="947" y="348" class="label" transform="rotate(90 947 348)">Policy + authorized context</text>
<path d="M860 625 V573 H1210 V535" class="edge" stroke-dasharray="7 5" marker-start="url(#arrow)"/><text x="1000" y="594" class="label">Bounded request / untrusted output</text>
<path d="M1380 699 H1410 V225 H1380" class="edge"/><text x="1400" y="586" class="label" transform="rotate(-90 1400 586)">Recheck and commit</text>
<path d="M60 810 H1380" stroke="#bcc5c9"/>
<text x="60" y="840" class="body">Delivery: GitHub Actions → container builds → Render frontend/API + managed PostgreSQL.</text>
<text x="60" y="865" class="label">Optional email: Resend. No source files sent to the planner. Pending workspace rollout is documented separately.</text></svg>
